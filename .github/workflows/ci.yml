name: CI/CD

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build

  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - run: zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe
      - run: mv zig-out/bin/spacedisplay zig-out/bin/spacedisplay_linux_amd64
      - run: zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSafe
      - run: mv zig-out/bin/spacedisplay.exe zig-out/bin/spacedisplay_windows_amd64.exe
      - run: zig build -Dtarget=x86_64-macos -Doptimize=ReleaseSafe
      - run: mv zig-out/bin/spacedisplay zig-out/bin/spacedisplay_darwin_amd64
      - run: zig build -Dtarget=aarch64-macos -Doptimize=ReleaseSafe
      - run: mv zig-out/bin/spacedisplay zig-out/bin/spacedisplay_darwin_arm64

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: spacedisplay-binaries
          path: zig-out/bin

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check .

  create-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test, lint, binaries ]
    permissions:
      contents: write
    steps:
      # full history: the previous-tag lookup walks the tag list
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: prev_tag
        run: |
          prev=$(git tag --sort=-creatordate | grep -m1 -A1 "^${GITHUB_REF_NAME}$" | tail -n1)
          if [ "$prev" = "$GITHUB_REF_NAME" ]; then prev=""; fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Compose changelog link
        id: changelog
        run: |
          if [ -n "${{ steps.prev_tag.outputs.prev }}" ]; then
            echo "link=**Full Changelog**: https://github.com/funbiscuit/spacedisplay-zig/compare/${{ steps.prev_tag.outputs.prev }}...${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "link=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download binaries
        uses: actions/download-artifact@v6
        with:
          name: spacedisplay-binaries
          path: artifacts

      - name: Display structure of downloaded files
        working-directory: artifacts
        run: ls -R

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: spacedisplay v${{ steps.get_version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Features

            * TODO

            ## Fixes

            * TODO

            ## Internal

            * TODO

            ${{ steps.changelog.outputs.link }}
          draft: false
          prerelease: true
          files: |
            artifacts/spacedisplay_linux_amd64
            artifacts/spacedisplay_windows_amd64.exe
            artifacts/spacedisplay_darwin_amd64
            artifacts/spacedisplay_darwin_arm64

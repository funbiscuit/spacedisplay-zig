name: CI/CD

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build

  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - run: zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe
      - run: mv zig-out/bin/spacedisplay zig-out/bin/spacedisplay_linux_amd64
      - run: zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSafe
      - run: mv zig-out/bin/spacedisplay.exe zig-out/bin/spacedisplay_windows_amd64.exe
      - run: zig build -Dtarget=x86_64-macos -Doptimize=ReleaseSafe
      - run: mv zig-out/bin/spacedisplay zig-out/bin/spacedisplay_darwin_amd64
      - run: zig build -Dtarget=aarch64-macos -Doptimize=ReleaseSafe
      - run: mv zig-out/bin/spacedisplay zig-out/bin/spacedisplay_darwin_arm64

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: spacedisplay-binaries
          path: zig-out/bin

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check .

  create-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test, lint, binaries ]
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v6
        with:
          name: spacedisplay-binaries
          path: artifacts

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Display structure of downloaded files
        working-directory: artifacts
        run: ls -R

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: spacedisplay v${{ steps.get_version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            Auto-generated release for version ${{ steps.get_version.outputs.version }}

            Changes:
            - TODO: Add release notes here
          draft: false
          prerelease: true
          files: |
            artifacts/spacedisplay_linux_amd64
            artifacts/spacedisplay_windows_amd64.exe
            artifacts/spacedisplay_darwin_amd64
            artifacts/spacedisplay_darwin_arm64
